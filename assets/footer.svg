<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170">
<style>
  @keyframes glitch {0%,86%,100%{transform:translate(7px,7px)} 88%{transform:translate(-6px,4px)} 90%{transform:translate(12px,-3px)} 92%{transform:translate(4px,9px)}}
  @keyframes pulse {0%,100%{opacity:.85} 50%{opacity:1}}
  @keyframes blink {0%,49%{opacity:1} 50%,100%{opacity:0}}
  @keyframes pop {0%{opacity:0;transform:scale(.6) rotate(-6deg)} 70%{opacity:1;transform:scale(1.08) rotate(1deg)} 100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes drift {from{transform:translateX(0)} to{transform:translateX(-60px)}}
  .t-glitch {animation:glitch 4s steps(1) infinite}
  .pulse {animation:pulse 2.4s ease-in-out infinite}
  .blink {animation:blink 1.1s steps(1) infinite}
  .drift {animation:drift 6s linear infinite}
  .pop {transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
  @media (prefers-reduced-motion: reduce) { * {animation:none!important;opacity:1!important} }
</style>
